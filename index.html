<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国茶类非遗数字化地图</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="experience.css">
  <link rel="stylesheet" href="detail-experience.css">
</head>
<body>
  <div class="paper-noise"></div>
  <div class="page-ambient page-ambient-a" aria-hidden="true"></div>
  <div class="page-ambient page-ambient-b" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <button class="brand-button" id="siteHomeButton" type="button">
      <span class="brand-emblem" aria-hidden="true"></span>
      <span class="brand-copy">
        <span class="brand-title" id="siteTitle">中国茶类非遗数字化地图</span>
      </span>
    </button>
    <nav class="breadcrumb" id="breadcrumb" aria-label="页面路径"></nav>
    <div class="site-actions">
      <button id="footprintsButton" class="header-button" type="button" data-explore-action="footprints">我的足迹</button>
      <button id="globalBackButton" class="header-button" type="button">返回</button>
      <button id="langToggle" class="header-button header-button-accent" type="button">EN</button>
    </div>
  </header>

  <main class="site-main">
    <header class="hero" id="landingShell">
      <div class="hero-copy">
        <p class="eyebrow" id="landingEyebrow">China Tea Intangible Cultural Heritage</p>
        <h1 id="landingTitle">中国茶类非遗数字化地图</h1>
        <p class="hero-subtitle" id="landingSubtitle">从全国地图出发，浏览不同地域的茶类非遗项目与文化脉络。</p>
        <div class="hero-actions">
          <button class="primary-link" id="enterMapButton" type="button">进入地图</button>
        </div>
        <div class="hero-stats" id="heroStats" aria-label="收录概览"></div>
      </div>
      <div class="hero-aside">
        <section class="discovery-entry" id="discoveryEntry" aria-label="探索茶文化"></section>
      </div>
    </header>

    <section class="stage-shell map-shell hidden" id="mapShell">
      <div class="page-head">
        <div>
          <p class="section-index" id="mapKicker">01 / 地图总览</p>
          <h2 id="mapTitle">在地图上浏览中国茶类非遗</h2>
          <p class="section-note" id="mapSummary">从全国分布开始，选择省份进入下一层浏览。</p>
        </div>
      </div>
      <div class="map-controls">
        <div class="map-browse-row">
        <div class="map-browse-toggle" id="mapBrowseToggle" aria-label="地图浏览方式">
          <button type="button" class="map-mode-button is-active" id="provinceBrowseButton" data-browse-mode="province">省份浏览</button>
          <button type="button" class="map-mode-button" id="projectBrowseButton" data-browse-mode="project">项目浏览</button>
        </div>
      </div>
      <div class="search-row" id="mapSearchRow">
        <div class="search-box">
          <input id="searchInput" type="search" aria-label="搜索项目名 / 省份 / 地区" placeholder="搜索项目名 / 省份 / 地区">
        </div>
      </div>
      </div>

      <div class="map-layout">
        <section class="map-panel">
          <div class="map-frame official-map-frame">
            <div class="map-stage official-map-stage" id="mapStage">
              <img class="map-reference-overlay hidden" id="referenceMapDebug" alt="中国行政区划参考底图，仅用于开发校准">
              <div class="map-toolbar" id="mapToolbar" aria-label="地图缩放控件">
                <button type="button" class="map-tool-button" id="zoomInButton">放大</button>
                <button type="button" class="map-tool-button" id="zoomOutButton">缩小</button>
                <button type="button" class="map-tool-button map-tool-reset" id="resetViewButton">复位</button>
                <div class="zoom-value" id="zoomValue">100%</div>
              </div>
              <p class="map-hint" id="mapHint"></p>
              <button type="button" class="map-inset-button" id="southSeaToggleButton">南海诸岛附图</button>
              <svg class="map-surface" id="officialMapSvg" viewBox="0 0 1000 760" aria-label="中国茶类非遗地图">
                <defs>
                  <linearGradient id="paperFill" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#fbf3dc"></stop>
                    <stop offset="100%" stop-color="#f2e5bc"></stop>
                  </linearGradient>
                  <pattern id="paperPattern" width="24" height="24" patternUnits="userSpaceOnUse">
                    <path d="M0 12 H24 M12 0 V24" stroke="rgba(162,133,84,0.05)" stroke-width="1"></path>
                  </pattern>
                  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6d5532" flood-opacity="0.16"></feDropShadow>
                  </filter>
                  <filter id="inkWobble" x="-8%" y="-8%" width="116%" height="116%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="6" result="noise"></feTurbulence>
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.9" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
                  </filter>
                </defs>
                <rect x="0" y="0" width="1000" height="760" rx="40" fill="url(#paperFill)"></rect>
                <rect x="0" y="0" width="1000" height="760" rx="40" fill="url(#paperPattern)"></rect>
                <g id="decorLayer"></g>
                <g id="chinaShapeLayer"></g>
                <g id="provinceBorderLayer"></g>
                <g id="nationalBoundaryLayer"></g>
                <g id="provinceLabelLayer"></g>
                <g id="provinceButtonLayer"></g>
                <g id="specialRegionLayer"></g>
                <g id="projectMarkerSvgLayer"></g>
                <g id="southSeaInsetLayer"></g>
              </svg>
              <div class="south-sea-float-panel hidden" id="southSeaFloatPanel"></div>
            </div>
          </div>
          <div class="map-legend" id="mapLegend"></div>
        </section>

        <aside class="map-context-panel" id="mapContextPanel"></aside>
      </div>
    </section>

    <section class="stage-shell province-shell hidden" id="provinceShell">
      <div class="page-head">
        <div>
          <p class="section-index" id="provinceKicker">02 / 省份页面</p>
          <h2 id="provinceTitle">请选择一个省份</h2>
          <p class="section-note" id="provinceSummary">点击地图上的省份后，这里会显示该地区的代表性茶类非遗项目。</p>
        </div>
      </div>
      <div class="province-meta" id="provinceMeta"></div>
      <div class="secondary-filter-shell">
        <div class="section-index" id="filterToolbarTitle">辅助筛选</div>
        <div class="filter-group" id="teaTypeFilters"></div>
      </div>
      <div class="project-grid" id="projectGrid"></div>
    </section>

    <section class="stage-shell detail-shell hidden" id="detailShell">
      <article class="detail-panel" id="detailPanel"></article>
    </section>
    <section class="stage-shell hidden" id="exploreShell" tabindex="-1"></section>
  </main>
  <aside class="compare-tray hidden" id="compareTray" aria-label="项目对照栏"></aside>
  <div class="explore-notice" id="exploreNotice" role="status" aria-live="polite"></div>
  <dialog class="replace-dialog" id="replaceDialog" aria-labelledby="replaceDialogTitle"></dialog>

  <script src="data/tea_heritage_data.js"></script>
  <script src="assets/china_official_admin_v2.js"></script>
  <script src="assets/map_compliance_meta.js"></script>
  <script src="data/explore_assets.js"></script>
  <script src="experience-core.js"></script>
  <script src="data/english_labels.js"></script>
  <script src="app.js"></script>
  <script src="sort-pointer.js"></script>
  <script src="detail-experience.js"></script>
  <script src="experience-render.js"></script>
  <script src="experience-ui.js"></script>
</body>
</html>
